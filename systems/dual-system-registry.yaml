schema: yhos_dual_system_registry/v1
status: proposed
north_star: health_optionality
architecture: one_kernel_two_engines_one_learning_system

shared_kernel:
  id: shared_health_kernel
  canonical_name: Shared Health Kernel
  owns:
    - principal_context
    - purpose
    - evidence_provenance
    - longitudinal_memory
    - life_context
    - health_clock
    - authority
    - scientific_domain_backbone_reference
    - decision_trace
    - learning_trace
  shared_scientific_backbone:
    id: twelve_health_domains
    source: fhp2_product_architecture
    callable_by: [performance, healthspan]
  does_not_own:
    - clinical_authority
    - private_reality_in_public_git
    - independent_surface_truth

engines:
  - id: performance
    canonical_name: Performance Engine
    objective: deployable_capacity
    founder_language: 身体余量
    primary_horizons: [now, daily, weekly]
    functional_projection:
      canonical_name: Six Human Functional Capacities
      items: [recover, adapt, energize, move, think, connect]
    uses_scientific_backbone: twelve_health_domains
    scientific_routing: dynamic_by_intent_context_evidence
    guardrail_engine: healthspan
    rule: performance_cannot_override_healthspan_safety

  - id: healthspan
    canonical_name: Healthspan Engine
    objective: sustainable_healthspan
    founder_language: 长期余地
    primary_horizons: [experimental, clinical, longitudinal]
    uses_scientific_backbone: twelve_health_domains
    completeness_scan_owner: true
    responsibilities:
      - long_term_risk
      - screening_and_followup_debt
      - clinical_evidence_review
      - unresolved_risk_closure
      - reserve_building
      - preventive_governance
    projects_to_performance: true

learning_system:
  id: one_reality_learning_system
  spine: [CTX, EVD, DEC, WPK, ACT, OUT, LRN, REUSED]
  shared_by: [performance, healthspan]
  constraints:
    act_is_not_outcome: true
    outcome_is_not_attribution: true
    outcome_is_not_learning: true
    learning_is_not_reuse: true
    task2_preload_required_for_reuse: true
    actual_task2_use_required_for_reuse: true

cross_system:
  modes:
    - performance_first
    - healthspan_first
    - coupled
  arbitration_priority:
    - safety
    - irreversible_long_term_risk
    - important_life_context
    - deployable_capacity
    - general_optimization
  target_milestone: FIRST_CROSS_SYSTEM_HEALTH_REUSE

identity_guardrails:
  two_engines_are_not_two_kernels: true
  two_engines_do_not_own_separate_truth: true
  twelve_domains_are_shared_not_healthspan_exclusive: true
  human_functional_capacities_are_not_fhp2_runtime_capabilities: true
