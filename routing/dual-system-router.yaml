schema: yhos_dual_system_router/v1
status: proposed
purpose: route_founder_intent_into_one_kernel_two_engines

pipeline:
  - parse_natural_language_intent
  - resolve_principal_purpose_and_context
  - select_system_mode
  - route_human_functional_capacities
  - route_shared_health_domains
  - resolve_health_clock
  - gather_required_evidence
  - check_evidence_quality_and_unknowns
  - check_authority_and_clinical_boundary
  - arbitrate_cross_system_priority
  - compile_minimum_useful_founder_output
  - register_follow_up_and_outcome_requirement

system_modes:
  performance_first:
    primary: performance
    secondary: healthspan
    secondary_role: safety_and_long_term_guardrail

  healthspan_first:
    primary: healthspan
    secondary: performance
    secondary_role: current_capacity_impact_or_build_projection

  coupled:
    primary: [performance, healthspan]
    arbitration_required: true

shared_scientific_backbone:
  id: twelve_health_domains
  callable_by: [performance, healthspan]
  healthspan_responsibility: longitudinal_completeness_scan
  performance_responsibility: route_domains_required_by_intent_context_and_evidence
  domain_truth_is_shared: true

arbitration:
  priority_order:
    - safety
    - irreversible_long_term_risk
    - important_life_context
    - deployable_capacity
    - general_optimization
  invariants:
    performance_cannot_override_healthspan_safety: true
    ai_cannot_override_clinical_authority: true
    short_clock_cannot_overwrite_long_clock: true

intent_defaults:
  today_capacity:
    mode: performance_first
    human_functional_capacities: [recover, adapt, energize, move, think, connect]
    domain_route: dynamic_by_evidence

  key_moment:
    mode: performance_first
    human_functional_capacity_route: dynamic_by_context
    domain_route: dynamic_by_evidence

  body_signal:
    mode: healthspan_first
    domain_route: completeness_plus_signal_specific
    performance_projection: impact_on_human_functional_capacities_when_supported
    clinical_gate_check: required

  life_disruption:
    mode: coupled
    human_functional_capacity_route: dynamic_by_disruption
    domain_route: dynamic_by_evidence

  long_game:
    mode: healthspan_first
    domain_route: twelve_domain_completeness_scan
    human_functional_capacity_projection: required

founder_contract:
  fields:
    - one_conclusion
    - one_reason
    - one_action
    - one_guardrail
    - one_evidence_door
  allow_no_action: true
  allowed_no_action_copy: 今天，你不用操心健康。

fail_closed_conditions:
  - missing_critical_evidence
  - contradictory_high_stakes_evidence
  - unresolved_clinical_red_flag
  - unclear_authority
  - medication_or_diagnosis_change_requested_without_clinical_authority
  - privacy_or_identity_scope_violation

non_claims:
  - route_is_not_diagnosis
  - priority_is_not_clinical_authority
  - recommendation_is_not_verified_action
  - action_is_not_outcome
  - outcome_is_not_learning
  - learning_is_not_reuse
